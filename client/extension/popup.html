<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; width: 220px; background: #101418; color: #e6edf3; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #1b7bb5; color: #fff; font-size: 12px; }
    .ok { color: #3fb950; font-weight: 600; }
    .muted { color: #9fb3c8; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>GLTD Kid Control</h1>
  <span class="badge">Extensão ativa</span>
  <p class="ok">✓ YouTube remodelado</p>
  <p class="muted">Shorts, recomendações e conteúdo bloqueado são ocultados automaticamente nesta máquina.</p>
</body>
</html>
